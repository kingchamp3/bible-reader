<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>성경을 읽다 - 성경 번역본</title>
    <link rel="stylesheet" href="./styles.css?v=testament-fallback-v1" />
  </head>
  <body data-bible-view="home" data-home-picker="none">
    <section class="bible-home" aria-label="성경 선택">
      <header class="home-header">
        <strong>성경</strong>
        <button
          id="homeThemeToggle"
          class="home-icon-button"
          type="button"
          aria-label="어두운 화면으로 전환"
          title="화면 테마"
        >
          ◐
        </button>
      </header>
      <div class="bible-home-content">
        <section class="home-intro">
          <p>말씀을 가까이</p>
          <h1><span>성경을</span><span>읽다</span></h1>
          <div class="home-title-rule" aria-hidden="true"></div>
        </section>
        <div class="home-auth" aria-label="로그인 및 회원가입">
          <div class="home-auth-actions">
            <button id="homeGoogleLoginButton" type="button">Google 로그인</button>
            <button id="homeGoogleSignupButton" type="button">회원가입</button>
          </div>
          <p id="homeAuthStatus" aria-live="polite">로그인 없이 성경을 읽을 수 있습니다.</p>
        </div>
        <div class="bible-home-actions">
          <button id="homeOldTestament" type="button">
            <strong>구약성서</strong>
            <span>39권의 책</span>
            <span class="home-action-arrow" aria-hidden="true">→</span>
          </button>
          <button id="homeNewTestament" type="button">
            <strong>신약성서</strong>
            <span>27권의 책</span>
            <span class="home-action-arrow" aria-hidden="true">→</span>
          </button>
        </div>
        <section id="homeBookPicker" class="home-book-picker" aria-live="polite" hidden>
          <div class="home-book-picker-heading">
            <strong id="homeBookPickerTitle">성경책 선택</strong>
            <button id="homeBookPickerBack" type="button">돌아가기</button>
          </div>
          <div id="homeBookList" class="home-book-list"></div>
        </section>
      </div>
    </section>

    <nav class="main-menu" aria-label="주요 메뉴">
      <strong class="main-menu-brand">성경을 읽다</strong>
      <button id="homeButton" type="button">처음</button>
      <button class="active" type="button" data-app-section="bible">성경</button>
      <button type="button" data-app-section="today">오늘</button>
      <button type="button" data-app-section="devotional">묵상</button>
      <button type="button" data-app-section="gratitude">감사</button>
      <button id="toolsMenuButton" type="button" aria-controls="appSidebar" aria-expanded="false">메뉴</button>
    </nav>

    <main class="app-shell">
      <aside id="appSidebar" class="sidebar" aria-label="성경 선택">
        <div class="sidebar-topbar">
          <strong>전체 메뉴</strong>
          <button id="closeSidebarButton" type="button">닫기</button>
        </div>
        <section class="brand">
          <p class="translation">개역한글</p>
          <h1>성경을 읽다</h1>
          <p>전체 성경을 읽고 검색하는 조용한 웹 성경</p>
        </section>

        <section class="member-panel" aria-label="회원 관리">
          <div id="authPanel" class="auth-panel">
            <button id="googleLoginButton" type="button">Google 로그인</button>
            <button id="logoutButton" type="button" hidden>로그아웃</button>
            <span id="authStatus">브라우저 저장 중</span>
          </div>
          <label>
            <span>회원</span>
            <select id="memberSelect"></select>
          </label>
          <div class="progress-card">
            <div>
              <strong id="progressPercent">0%</strong>
              <span id="progressSummary">읽은 장 0 / 0</span>
            </div>
            <button id="lastReadButton" type="button">최근 위치</button>
            <button id="chapterReadToggle" type="button">현재 장 체크</button>
          </div>
        </section>

        <label class="search-box">
          <span>대조 번역 1</span>
          <select id="compareTranslationSelect"></select>
        </label>

        <label class="search-box">
          <span>대조 번역 2</span>
          <select id="compareTranslationSelect2"></select>
        </label>

        <section id="sourceAttribution" class="source-attribution" hidden></section>

        <section class="toolbar" aria-label="읽기 설정">
          <button id="decreaseFont" type="button">A-</button>
          <output id="fontSizeLabel">20</output>
          <button id="increaseFont" type="button">A+</button>
          <button id="themeToggle" type="button">어둡게</button>
        </section>

        <section class="favorite-actions split-actions">
          <button id="favoritesToggle" type="button">즐겨찾기 보기</button>
          <button id="compareToggle" type="button">대조 보기</button>
        </section>

        <section class="highlight-filter" aria-label="형광펜 모아보기">
          <span>형광펜 모아보기</span>
          <div>
            <button type="button" data-highlight-filter="yellow">노랑</button>
            <button type="button" data-highlight-filter="green">초록</button>
            <button type="button" data-highlight-filter="pink">분홍</button>
            <button type="button" data-highlight-filter="blue">파랑</button>
          </div>
        </section>

        <section class="bible-navigator" aria-label="성경 장절 선택">
          <div class="navigator-heading">
            <span>성경 장절</span>
            <p id="biblePath" class="bible-path" aria-live="polite"></p>
          </div>
          <div class="testament-tabs">
            <button id="oldTab" class="active" type="button">구약성서</button>
            <button id="newTab" type="button">신약성서</button>
          </div>
          <div class="navigator-step">
            <span>성경책</span>
            <div id="bookList" class="book-buttons"></div>
          </div>
          <div class="navigator-step">
            <span>장</span>
            <div id="chapterList" class="chapter-buttons"></div>
          </div>
        </section>

        <section class="reading-plan" aria-label="성경 읽기표">
          <span>성경 읽기표</span>
          <div id="readingPlan" class="reading-plan-grid"></div>
        </section>
      </aside>
      <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="메뉴 닫기"></button>

      <section class="reader-panel">
        <section class="content-section active" data-content-section="bible">
          <section class="reader-utility-bar" aria-label="성경 읽기 도구">
            <label class="reader-translation-control">
              <span>번역본</span>
              <select id="translationSelect"></select>
            </label>
            <label class="reader-search-control">
              <span>성경 검색</span>
              <input id="searchInput" type="search" placeholder="구절, 단어 검색" autocomplete="off" />
            </label>
            <button
              id="readerBookMenuButton"
              type="button"
              aria-controls="appSidebar"
              aria-expanded="false"
            >
              책/장 선택
            </button>
          </section>

          <header class="reader-header">
            <div>
              <p id="readerMeta" class="reader-meta">개역한글</p>
              <h2 id="readerTitle">창세기 1장</h2>
            </div>
            <div class="bookmark-count">
              <strong id="bookmarkCount">0</strong>
              <span>저장</span>
            </div>
          </header>

          <section id="readerModeBar" class="reader-mode-bar" aria-label="빠른 번역 보기">
            <span>빠른 보기</span>
            <div>
              <button type="button" data-reader-mode="krv">한글</button>
              <button type="button" data-reader-mode="niv">NIV</button>
              <button type="button" data-reader-mode="compare-2">2개 대조</button>
              <button type="button" data-reader-mode="compare-3">3개 대조</button>
            </div>
          </section>

          <section class="reader-passage-navigation" aria-label="성경책과 장 이동">
            <nav class="reader-chapter-strip-navigation" aria-label="현재 성경책의 장 선택">
              <strong id="readerBookName" class="reader-current-book">창세기</strong>
              <div id="readerChapterList" class="reader-chapter-list"></div>
            </nav>
            <nav class="chapter-navigation chapter-navigation-top" aria-label="장 이동">
              <button type="button" data-chapter-direction="previous">‹ 이전 장</button>
              <button type="button" data-chapter-direction="next">다음 장 ›</button>
            </nav>
          </section>

          <section class="reader-highlighter" aria-label="형광펜">
            <span>형광펜</span>
            <div id="readerHighlightPalette" class="reader-highlight-palette">
              <button class="highlight-swatch highlight-yellow" type="button" data-reader-highlight="yellow" aria-label="노랑 형광펜" title="노랑 형광펜"></button>
              <button class="highlight-swatch highlight-green" type="button" data-reader-highlight="green" aria-label="초록 형광펜" title="초록 형광펜"></button>
              <button class="highlight-swatch highlight-pink" type="button" data-reader-highlight="pink" aria-label="분홍 형광펜" title="분홍 형광펜"></button>
              <button class="highlight-swatch highlight-blue" type="button" data-reader-highlight="blue" aria-label="파랑 형광펜" title="파랑 형광펜"></button>
              <button class="highlight-clear" type="button" data-reader-highlight="clear">지우기</button>
            </div>
          </section>

          <section id="resultSummary" class="result-summary" hidden></section>
          <article id="verseList" class="verse-list" aria-live="polite"></article>
          <nav class="chapter-navigation chapter-navigation-bottom" aria-label="본문 아래 장 이동">
            <button type="button" data-chapter-direction="previous">‹ 이전 장</button>
            <button type="button" data-chapter-direction="next">다음 장 ›</button>
          </nav>
        </section>

        <section class="content-section today-panel" data-content-section="today" aria-label="오늘의 말씀">
          <section class="daily-card" id="dailyVerseCard">
            <span>오늘의 말씀</span>
            <button id="dailyVerseButton" type="button">불러오는 중</button>
          </section>
        </section>

        <section class="content-section menu-panel" data-content-section="devotional" aria-label="묵상 노트">
          <header class="menu-panel-header">
            <p class="reader-meta">기록</p>
            <h2>묵상 노트</h2>
          </header>
          <section class="devotional-card">
            <span>묵상 작성</span>
            <form id="devotionalForm" class="devotional-form">
              <label>
                <small>날짜</small>
                <input id="devotionalDate" type="date" />
              </label>
              <label>
                <small>오늘 읽은 본문</small>
                <input id="devotionalPassage" type="text" placeholder="예: 요한복음 3장" />
              </label>
              <button id="useCurrentPassageButton" type="button">현재 본문 넣기</button>
              <label>
                <small>깨달은 점</small>
                <textarea id="devotionalInsight" rows="3" placeholder="말씀을 통해 깨달은 점"></textarea>
              </label>
              <label>
                <small>기도 제목</small>
                <textarea id="devotionalPrayer" rows="3" placeholder="기도로 올려드릴 제목"></textarea>
              </label>
              <label>
                <small>적용할 점</small>
                <textarea id="devotionalAction" rows="3" placeholder="오늘 삶에서 실천할 한 가지"></textarea>
              </label>
              <button type="submit">묵상 저장</button>
            </form>
            <p id="devotionalStatus" class="devotional-status"></p>
            <div id="devotionalList" class="devotional-list"></div>
          </section>
        </section>

        <section class="content-section menu-panel" data-content-section="gratitude" aria-label="감사 한줄">
          <header class="menu-panel-header">
            <p class="reader-meta">나눔</p>
            <h2>감사 한줄</h2>
          </header>
          <section class="gratitude-card">
            <span>감사 나누기</span>
            <form id="gratitudeForm" class="gratitude-form">
              <input id="gratitudeInput" type="text" maxlength="80" placeholder="오늘 감사한 일을 한줄로" />
              <button type="submit">나누기</button>
            </form>
            <p id="gratitudeStatus" class="gratitude-status"></p>
            <div id="gratitudeList" class="gratitude-list"></div>
          </section>
        </section>
      </section>
    </main>
    <div id="selectionActionMenu" class="selection-action-menu" aria-label="선택한 구절 메뉴" hidden>
      <button type="button" data-selection-action="save">저장</button>
      <button type="button" data-selection-action="note">메모</button>
    </div>

    <script src="./firebase-config-9ec46.js"></script>
    <script type="module" src="./firebase-auth.js?v=security-audit-v1"></script>
    <script src="./bibles-data.js?v=today-menu-v1"></script>
    <script src="./sblgnt-loader.js?v=today-menu-v1"></script>
    <script src="./wlc-loader.js?v=today-menu-v1"></script>
    <script type="module" src="./app.js?v=testament-fallback-v1"></script>
  </body>
</html>
